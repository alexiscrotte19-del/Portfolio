        <main id="main-content">
        <!-- Section de contact avec formulaire et liens -->
        <section id="contact">
            <h1>Contact</h1>
            <!-- Champ de hameçonnage pour prévenir les spams -->
            <form id="contactForm">
                <div class ="honeypot">
                    <label for="site_web">Site web (laisser vide)</label>
                    <input type="text" id="site_web" name="site_web" tabindex="-1" autocomplete="off">
                </div>
                
                <div>
                    <label for="nom">Nom</label>
                    <input type="text" id="nom" name="nom" required>
                </div>

                <div>
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div>
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>

                <button type="submit">Envoyer le message</button>
                <p id="formStatus" role="status" aria-live="polite"></p>
            </form>

            <a href="index.html" id="backHome">← Retour à l'accueil</a>
        </section>
